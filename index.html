<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Moki: Un salto más</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #0A0A0A; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      #game { position: fixed; inset: 0; }
      canvas { display: block; }
      /* Portada en HTML/CSS: cielo de papel, suelo de cartón y el letrero, visibles antes de que cargue Phaser */
      #boot { position: fixed; inset: 0; background: linear-gradient(#f79e52 0 30%, #fca956 30% 52%, #ffd27a 52% 62%, #e9d2ae 62% 64%, #cd9468 64% 100%); transition: opacity 260ms ease-out; z-index: 5; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .tag { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) rotate(-1deg); padding: 9px 18px; background: #f4e8d5; border: 3px solid #8a7e70; border-radius: 12px; box-shadow: 0 4px 0 rgba(34, 33, 31, 0.38); font: 700 17px/22px Outfit, system-ui, sans-serif; color: #22211f; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="boot"><div class="tag"><b>Demo</b> · Toca para jugar</div></div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
